{% extends "base.html" %}

{% block content %}

<div class="text-center mb-5">
    <h1 class="fw-bold">My Notes</h1>
    <p class="text-muted">
        Create, edit and manage your personal notes.
    </p>
</div>

<!-- Add Note -->
<div class="card shadow-sm mb-5">
    <div class="card-body">

        <h4 class="mb-4">Add New Note</h4>

        <form method="POST" action="{{ url_for('add_note') }}">

            <div class="mb-3">
                <label class="form-label">Title</label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Enter note title"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>

                <textarea
                    name="content"
                    class="form-control"
                    rows="4"
                    placeholder="Write your note..."
                    required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Add Note
            </button>

        </form>

    </div>
</div>


<!-- Display Notes -->
<div class="row">

    {% for note in notes %}

    <div class="col-md-6 col-lg-4 mb-4">

        <div class="card shadow-sm h-100">

            <div class="card-body">

                <h5 class="card-title">
                    {{ note["title"] }}
                </h5>

                <p class="card-text text-muted">
                    {{ note["content"] }}
                </p>

                <div class="d-flex gap-2">

                    <a
                        href="{{ url_for('edit_note', note_id=note['id']) }}"
                        class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <form
                        method="POST"
                        action="{{ url_for('delete_note', note_id=note['id']) }}">

                        <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this note?')">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    {% else %}

    <div class="text-center">
        <p class="text-muted">
            No notes available. Add your first note above.
        </p>
    </div>

    {% endfor %}

</div>

{% endblock %}
