{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h3 class="mb-4">
                    Edit Note
                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ note['title'] }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Content
                        </label>

                        <textarea
                            name="content"
                            class="form-control"
                            rows="6"
                            required>{{ note['content'] }}</textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Changes

                    </button>

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
